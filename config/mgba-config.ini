; mGBA settings, installed to /root/.config/mgba/config.ini only if that file doesn't exist.
;
; Controller mapping: mGBA 0.7.0 (SDL build) reads raw joystick button numbers and ignores
; SDL's controller database. Without a mapping only the D-pad works (axes 0/1 and hat 0).
; The SDL build uses "gba" section names even for Game Boy games. Button numbers come from
; `jstest /dev/input/js0` on the board (see manual step 3 in plans/initial-planning.md).
;   [gba.input.SDLB]                      applies to any controller
;   [gba.input-profile.<joystick name>]   one controller model; overrides gba.input.SDLB
[ports.sdl]

; Default mapping for any controller without its own section (the USB controller tested on
; the board, 2026-11-11). The D-pad lines repeat mGBA's built-in default (axis 0 = left/right,
; axis 1 = up/down), written out so the whole mapping is in one place.
[gba.input.SDLB]
keyA=1
keyB=2
keyStart=9
keySelect=8
; L and R aren't Game Boy buttons; they're mapped for the save-state shortcuts in
; launcher/hotkeys.py (L+R+Select saves, L+R+Start loads). Confirmed on the board.
keyL=4
keyR=5
axisLeftAxis=-0
axisLeftValue=-16384
axisRightAxis=+0
axisRightValue=16384
axisUpAxis=-1
axisUpValue=-16384
axisDownAxis=+1
axisDownValue=16384

; Bluetooth: Xbox Wireless Controller (tested on the board 2026-11-12). The section name
; must match the controller's name exactly (cat /sys/class/input/js*/device/name). Only the
; buttons are listed; everything else comes from [gba.input.SDLB] above. The D-pad is a hat,
; which mGBA maps to the D-pad by default.
[gba.input-profile.Xbox Wireless Controller]
keyA=1
keyB=0
keyL=4
keyR=5
keySelect=6
keyStart=7

